<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>MoonBoard Model Quick Test</title>
</head>

<body>
  <h1>MoonBoard Grade Predictor Test</h1>
  <pre id="output">Initializing...</pre>

  <!-- We'll use ES modules in-browser. -->
  <script type="module">
    // Import TF.js and npyjs as ES modules from jsDelivr
    import * as tf from 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/+esm';
    import NPYJS from 'https://cdn.jsdelivr.net/npm/npyjs@0.7.0/+esm';

    // ====== Paste your POS2I and GFONT maps here ======
    const POS2I_MAIN = {/* … */ };
    const POS2I_START = {/* … */ };
    const POS2I_END = {/* … */ };
    const GFONT = [
      '6A+', '6B', '6B+', '6C', '6C+',
      '7A', '7A+', '7B', '7B+', '7C',
      '7C+', '8A', '8A+', '8B', '8B+',
    ];
    // ================================================

    function encodeHolds(holds) {
      const vecMain = new Array(Object.keys(POS2I_MAIN).length).fill(0);
      const vecStart = new Array(Object.keys(POS2I_START).length).fill(0);
      const vecEnd = new Array(Object.keys(POS2I_END).length).fill(0);

      for (let raw of holds) {
        let h = raw.trim().toUpperCase();
        const isStart = h.endsWith('S');
        const isEnd = h.endsWith('T');
        if (isStart || isEnd) h = h.slice(0, -1);
        if (h in POS2I_MAIN) vecMain[POS2I_MAIN[h]] = 1;
        if (isStart && h in POS2I_START) vecStart[POS2I_START[h]] = 1;
        if (isEnd && h in POS2I_END) vecEnd[POS2I_END[h]] = 1;
      }
      return tf.tensor2d([vecMain.concat(vecStart).concat(vecEnd)]);
    }

    async function loadModel() {
      const model = tf.sequential();
      // ----- fill in your best‐hp values: -----
      const numDenseBlocks = 4;
      const unitsPerBlock = 64;
      // ----------------------------------------
      model.add(tf.layers.dense({ inputShape: [572], units: unitsPerBlock, activation: 'relu', kernelInitializer: 'zeros', biasInitializer: 'zeros' }));
      for (let i = 1; i < numDenseBlocks; i++) {
        model.add(tf.layers.dense({ units: unitsPerBlock, activation: 'relu', kernelInitializer: 'zeros', biasInitializer: 'zeros' }));
      }
      model.add(tf.layers.dense({ units: 16, activation: 'relu', kernelInitializer: 'zeros', biasInitializer: 'zeros' }));
      model.add(tf.layers.dense({ units: 1, activation: 'linear', kernelInitializer: 'zeros', biasInitializer: 'zeros' }));

      const npy = new NPYJS();
      for (let i = 1; i <= model.layers.length; i++) {
        const layer = model.layers[i];
        const ws = [];
        for (let j = 0; ; j++) {
          const url = `weights/layer_${i}_weight_${j}.npy`;
          try {
            await fetch(url, { method: 'HEAD' });
          } catch {
            break;
          }
          const { data, shape } = await npy.load(url);
          ws.push(tf.tensor(data, shape, 'float32'));
        }
        layer.setWeights(ws);
        console.log(`Layer ${i} weights shapes:`, ws.map(w => w.shape));
      }
      return model;
    }

    async function runTest() {
      const out = document.getElementById('output');
      try {
        out.textContent = 'Loading model…';
        const model = await loadModel();
        out.textContent = 'Encoding…';
        const x = encodeHolds(['B18', 'F6S', 'D18T']);
        console.log('Input shape:', x.shape);
        out.textContent = 'Predicting…';
        const p = (await model.predict(x).array())[0][0];
        console.log('Raw pred:', p);
        const idx = Math.round(Math.min(Math.max(p, 0), GFONT.length - 1));
        out.textContent = `Numeric: ${p.toFixed(2)}\nLabel: ${GFONT[idx]}`;
      } catch (e) {
        console.error(e);
        document.getElementById('output').textContent = `Error:\n${e}`;
      }
    }

    window.addEventListener('DOMContentLoaded', runTest);
  </script>
</body>

</html>
