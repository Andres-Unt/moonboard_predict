<!DOCTYPE html>

<html>

<body>
    <div class="content">
        <canvas id="board"></canvas>
        <div id="overlay">
            <div id="selection">Selected: </div>
            <div id="prediction">Grade: </div>
        </div>
        <script src="index.js"></script>
        <script>
            const canvas = document.getElementById('board');
            const targetVW = 1.0;
            function applyScale() {
                const scale = (window.innerWidth * targetVW) / canvas.width;
                canvas.style.transform = `scale(${scale})`;
                canvas.style.transformOrigin = 'top left';
            }
            window.addEventListener('resize', applyScale);
            document.addEventListener('DOMContentLoaded', applyScale);
            setTimeout(applyScale, 100);
            setTimeout(applyScale, 1000);
        </script>
    </div>
</body>
<style>
    body {
        overflow: hidden;
        margin: 0;
    }

    .content {
        width: 100vw;
        height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
    }

    #selection {
        visibility: hidden;
    }

    canvas#board {
        display: block;
    }

    #overlay {
        position: absolute;
        top: 30px;
        left: 0;
        color: white;
        opacity: 0.5;
        font-size: 32px;
        pointer-events: none;
        font-family: sans-serif;
        font-weight: bold;
        text-shadow: 2px 2px 4px #000;
    }

    /* Mobile styles */
    @media (orientation: portrait) {
        #overlay {
            top: auto;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
    }
</style>

</html>
